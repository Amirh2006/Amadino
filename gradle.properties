org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KAPT is incompatible with AGP 9 built-in Kotlin support;
# disable built-in Kotlin and new DSL to allow Room annotation processing via KAPT.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official

# Network resilience for flaky dependency downloads
systemProp.org.gradle.internal.repository.max.retries=15
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.jdk.tls.client.protocols=TLSv1.2

# Disable Kotlin compiler daemon (crashes on this environment with Java 25 + KAPT)
systemProp.kotlin.daemon.enabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
